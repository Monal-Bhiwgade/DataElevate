# Publishes to PyPI when you publish a GitHub Release.
# Uses PyPI Trusted Publishing: no PyPI password or API token is stored anywhere.
# One-time setup on pypi.org: DataElevate -> Settings -> Publishing -> add a GitHub
# publisher with owner "Monal-Bhiwgade", repo "DataElevate", workflow "publish.yml",
# environment "pypi".
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/check_dist.py dist/*
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

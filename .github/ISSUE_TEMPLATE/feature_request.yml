name: New data source or feature
description: Suggest a data source, file format or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request?
      options:
        - New data source (warehouse, API, storage, ...)
        - New file format
        - Improvement to an existing loader
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The data you need to load and what's painful about it today.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: How would you like to call it?
      render: python
      placeholder: |
        df = Load_data.from_snowflake(table="orders", ...)
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself (see CONTRIBUTING.md)
